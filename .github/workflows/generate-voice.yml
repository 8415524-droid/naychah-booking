name: generate-voice
on:
  workflow_dispatch:
    inputs:
      sample_text:
        required: false
      sample_name:
        required: false
      style_extra:
        required: false
      voices:
        description: 'רשימת קולות לדוגמה, מופרדת בפסיקים (ריק = קובץ הפתיח הסופי)'
        required: false
        default: ''
      only:
        description: 'מפתחות קליפים בלבד, מופרדים בפסיקים (למשל welcome). ריק = הכול'
        required: false
        default: ''
      max_keys:
        description: 'מספר מפתחות מקסימלי (עד המפתח ה-N, 0 = כולם)'
        required: false
        default: '0'
      skip_keys:
        description: 'כמה מפתחות מההתחלה לדלג (0 = כולם)'
        required: false
        default: '0'
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node scripts/gen-voice.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          VOICES: ${{ inputs.voices }}
          SAMPLE_TEXT: ${{ inputs.sample_text }}
          SAMPLE_NAME: ${{ inputs.sample_name }}
          STYLE_EXTRA: ${{ inputs.style_extra }}
          ONLY: ${{ inputs.only }}
          SKIP_KEYS: ${{ inputs.skip_keys }}
          MAX_KEYS: ${{ inputs.max_keys }}
      - name: commit audio
        if: always()
        run: |
          git config user.name "voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add public/audio
          git commit -m "קבצי קריינות אנושית" || echo "אין שינוי"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
