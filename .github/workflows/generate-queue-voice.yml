name: generate-queue-voice
on:
  workflow_dispatch:
    inputs:
      skip_keys:
        description: 'כמה מפתחות מההתחלה לדלג (3 = רק מפתח 4)'
        required: false
        default: '0'
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node scripts/gen-queue-voice.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          SKIP_KEYS: ${{ inputs.skip_keys }}
      - name: commit audio
        if: always()
        run: |
          git config user.name "voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add public/audio/queue-speech
          git commit -m "הקראות תור ההמתנה (דיבור בלבד)" || echo "אין שינוי"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
